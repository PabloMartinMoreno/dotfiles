# kitty — paleta eldritch, la misma que usa nvim (lua/config/paleta.lua).

# ---------------------------------------------------------------- fuente
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Interlineado holgado: es lo que da el aire del render de Neovide.
modify_font cell_height 128%

# JetBrainsMono Nerd Font trae los glifos embebidos, incluido el rango
# U+F0001-U+F1AF0 (Material Design Icons) que usa render-markdown para los
# íconos de heading. No hace falta symbol_map.

# ------------------------------------------------------------ ventana
background_opacity 0.85
dynamic_background_opacity yes
window_padding_width 10
confirm_os_window_close 0

# Cursor con estela: lo más cercano al cursor animado de Neovide.
cursor_trail 3
cursor_trail_decay 0.1 0.4

# ------------------------------------------------------------ paleta eldritch
background            #212337
foreground            #ebfafa
selection_background  #76639e
selection_foreground  #ebfafa
cursor                #f265b5
cursor_text_color     #212337
url_color             #04d1f9

active_border_color   #a48cf2
inactive_border_color #3b4261

active_tab_background   #212337
active_tab_foreground   #f265b5
inactive_tab_background #171928
inactive_tab_foreground #7081d0

# negro / gris
color0  #171928
color8  #414868
# rojo
color1  #f16c75
color9  #f0313e
# verde
color2  #37f499
color10 #00FA82
