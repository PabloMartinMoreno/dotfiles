# kitty — paleta eldritch, la misma que usa nvim (lua/config/paleta.lua).

# ---------------------------------------------------------------- fuente
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Interlineado holgado: es lo que da el aire del render de Neovide.
modify_font cell_height 128%

# JetBrainsMono Nerd Font trae los glifos embebidos, incluido el rango
# U+F0001-U+F1AF0 (Material Design Icons) que usa render-markdown para los
# íconos de heading. No hace falta symbol_map.

# ------------------------------------------------------------ ventana
background_opacity 0.85
dynamic_background_opacity yes
window_padding_width 10
confirm_os_window_close 0

# Cursor con estela: lo más cercano al cursor animado de Neovide.
cursor_trail 3
cursor_trail_decay 0.1 0.4

# ------------------------------------------------------------ paleta eldritch
background            #212337
foreground            #ebfafa
selection_background  #76639e
selection_foreground  #ebfafa
cursor                #f265b5
cursor_text_color     #212337
url_color             #04d1f9

active_border_color   #a48cf2
inactive_border_color #3b4261

active_tab_background   #212337
active_tab_foreground   #f265b5
inactive_tab_background #171928
inactive_tab_foreground #7081d0

# negro / gris
color0  #171928
color8  #414868
# rojo
color1  #f16c75
color9  #f0313e
# verde
color2  #37f499
color10 #00FA82
# amarillo
color3  #f1fc79
color11 #f7c67f
# azul / violeta
color4  #a48cf2
color12 #76639e
# magenta / rosa
color5  #f265b5
color13 #bf4f8e
# cyan
color6  #04d1f9
color14 #39DDFD
# blanco
color7  #ABB4DA
color15 #ebfafa

# ---------------------------------------------------------------- teclas
# Verificadas contra nvim (LazyVim) y zsh: ninguna pisa un atajo en uso.
map ctrl+shift+backspace change_font_size all 0

# ventanas y layouts de kitty
# El layout decide dónde cae la ventana nueva; `splits` habilita hsplit/vsplit.
enabled_layouts splits,stack,tall,fat,grid

map alt+enter        launch --location=hsplit --cwd=current
map alt+shift+enter  launch --location=vsplit --cwd=current
# nav entre ventanas (splits): igual esquema que las pestañas en alt+h/l.
# alt+shift+h/l libres en nvim y zsh — verificado. j/k con shift también: las
# minúsculas son el mover-línea de LazyVim, por eso alt+j/alt+k quedaron fuera.
# Hace falta el hjkl completo porque alt+enter usa hsplit, que apila
# arriba/abajo, y left/right no llega a esas ventanas.
map alt+shift+h      neighboring_window left
map alt+shift+j      neighboring_window bottom
map alt+shift+k      neighboring_window top
map alt+shift+l      neighboring_window right
# Cerrar el split. alt+w a secas lo usa snacks.nvim para cycle_win dentro del
# picker; con shift no colisiona. Reemplaza al ctrl+shift+w por defecto.
map alt+shift+w      close_window
map ctrl+shift+w     no_op
map ctrl+shift+l     next_layout
map ctrl+alt+r       goto_layout tall
# Esconder los splits sin cerrarlos: el layout stack deja una sola ventana
# visible y las demás siguen corriendo. `toggle_layout` vuelve al layout
# anterior, que `goto_layout` no hace (no hay binding directo a splits).
map alt+s            toggle_layout stack

# tabs
map alt+t            new_tab
# Pestaña nueva heredando el cwd de la ventana activa; `new_tab` a secas abre en
# el directorio de arranque. Reemplaza al ctrl+shift+t por defecto de kitty.
map alt+shift+t      new_tab_with_cwd
map ctrl+shift+t     no_op
map alt+l            next_tab
map alt+h            previous_tab
map ctrl+shift+q     close_tab
# Salto directo por número. kitty no trae binding de fábrica para goto_tab.
# alt+1..9 libre: dwm liga los tags a Mod4, nvim y tmux no usan alt+dígito.
map alt+1            goto_tab 1
map alt+2            goto_tab 2
map alt+3            goto_tab 3
map alt+4            goto_tab 4
map alt+5            goto_tab 5
map alt+6            goto_tab 6
map alt+7            goto_tab 7
map alt+8            goto_tab 8
map alt+9            goto_tab 9

# portapapeles
map alt+c            copy_to_clipboard
map alt+v            paste_from_clipboard

# scroll de página
map alt+d            scroll_page_down
map alt+u            scroll_page_up

# OMITIDAS por conflicto con nvim (kitty intercepta antes de que la tecla
# llegue al editor):
#   alt+j / alt+k   next/previous_window  ->  nvim mueve la línea abajo/arriba
#   ctrl+j / ctrl+k scroll_line_down/up   ->  nvim salta al split de abajo/arriba
# El scroll por línea sigue disponible en el nativo ctrl+shift+flecha.
