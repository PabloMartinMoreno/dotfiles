[opener]
edit = [
	{ run = 'nvim %s', desc = "nvim", block = true, for = "unix" },
]
default = [
	{ run = 'xdg-open %s1', desc = "Open", orphan = true, for = "linux" },
]

[open]
rules = [
	{ url = "*/", use = "edit" },
	{ mime = "text/*", use = "edit" },
	{ mime = "application/{json,ndjson,javascript,xml,x-shellscript,toml,yaml,x-yaml}", use = "edit" },
	{ mime = "inode/empty", use = "edit" },
	{ url = "*", use = "default" },
]
